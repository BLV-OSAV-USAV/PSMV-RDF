<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Protection Products: Linked Data Documentation</title>
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #555; --card: #f5f5f5; --accent: #d52b1e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161616; --fg: #eee; --muted: #aaa; --card: #232323; }
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg);
           max-width: 760px; margin: 0 auto; padding: 3rem 1.25rem; line-height: 1.5; }
    h1 { margin-bottom: 0.25rem; }
    p.lead { color: var(--muted); margin-top: 0; }
    .cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 2rem; }
    a.card { display: block; padding: 1.25rem; border-radius: 10px; background: var(--card);
             color: inherit; text-decoration: none; border-left: 4px solid var(--accent); }
    a.card:hover { outline: 2px solid var(--accent); }
    a.card h2 { margin: 0 0 0.4rem; font-size: 1.15rem; }
    a.card p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Plant Protection Products</h1>
  <p class="lead">Linked data on LINDAS, published by the FSVO.</p>

  <div class="cards">
    <a class="card" href="shacl-documentation.html">
      <h2>Data model</h2>
      <p>Classes, properties and constraints (SHACL documentation).</p>
    </a>
    <a class="card" href="query-guide.html">
      <h2>SPARQL query guide</h2>
      <p>Ready-to-use queries for products, crops, pests and substances.</p>
    </a>
    <a class="card" href="https://agriculture.ld.admin.ch/sparql/#">
      <h2>SPARQL editor</h2>
      <p>Run queries directly against LINDAS in your browser.</p>
    </a>
  </div>
</body>
</html>
