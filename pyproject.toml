[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psmv-rdf"
version = "0.2.0"
description = "Pipeline for converting the Swiss plant protection product registry (PSMV) into RDF linked data."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "BLV-OSAV-USAV" }
]
keywords = ["rdf", "linked-data", "plant-protection", "switzerland", "psmv", "open-data"]
requires-python = ">=3.12"

dependencies = [
    "rdflib>=7.4.0",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "pysftp>=0.2.9",
    "pyshacl>=0.31.0",
    "otsrdflib>=0.2.9",
    "duckdb>=1.5.0",
    "SPARQLWrapper>=2.0.0",
    "python-dotenv>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
psmv-rdf = "service.pipeline:run_pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["service*", "src*"]