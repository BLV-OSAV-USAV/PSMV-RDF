name: Server health

on:
  schedule:
    - cron: "0 6 * * 1-5"   # weekdays 06:00 UTC
  workflow_dispatch:         # manual "Run workflow" button

jobs:
  server-health:
    name: server-health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m network -v
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          LINDAS_USER: ${{ secrets.LINDAS_USER }}
          LINDAS_PASSWORD: ${{ secrets.LINDAS_PASSWORD }}
          LINDAS_PASSWORD_INT: ${{ secrets.LINDAS_PASSWORD_INT }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
          ENDPOINT_INT: ${{ secrets.ENDPOINT_INT }}