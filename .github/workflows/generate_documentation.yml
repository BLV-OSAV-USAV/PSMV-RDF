name: Generate Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rdf/processed/shapes.ttl'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'rdf/processed/shapes.ttl'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether docs need rebuilding
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          get_version() {
            python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['tool']['shacl-docgen']['shacl_play_version'])"
          }

          if [ "$EVENT" = "pull_request" ]; then
            HEAD_REF="$PR_HEAD"
            BASE=$(git merge-base "origin/$GITHUB_BASE_REF" "$PR_HEAD" 2>/dev/null || true)
          else
            HEAD_REF="HEAD"
            BASE="$PUSH_BEFORE"
          fi

          new=$(git show "$HEAD_REF:pyproject.toml" | get_version)
          echo "version=$new" >> "$GITHUB_OUTPUT"

          # Manual runs, or no usable base commit: always build
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          old=$(git show "$BASE:pyproject.toml" 2>/dev/null | get_version 2>/dev/null || echo none)

          if ! git diff --quiet "$BASE" "$HEAD_REF" -- rdf/processed/shapes.ttl || [ "$old" != "$new" ]; then
            echo "Rebuild: shapes changed or SHACL Play $old -> $new"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip: pyproject.toml changed, but not the SHACL Play version"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  run-pipeline:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-caching: true

      - name: Install system dependencies
        run: sudo apt-get install -y libssh2-1-dev graphviz

      - name: Install dependencies
        run: uv sync

      - name: Restore SHACL-Play JAR cache
        id: cache-jar
        uses: actions/cache/restore@v4
        with:
          path: service/shacl_play
          key: shacl-play-jar-${{ needs.changes.outputs.version }}

      - name: Run documentation script
        run: uv run python service/shacl_docgen.py --diagram

      - name: Save SHACL-Play JAR cache
        if: steps.cache-jar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: service/shacl_play
          key: shacl-play-jar-${{ needs.changes.outputs.version }}

      - name: Upload generated docs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shacl-docs
          path: docs/
          retention-days: 90