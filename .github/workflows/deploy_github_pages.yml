name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_run:
    workflows: ["Generate Documentation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  find-docs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find run with generated docs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            n=$(gh api "repos/$REPO/actions/runs/$TRIGGER_RUN/artifacts" \
                  --jq '[.artifacts[] | select(.name == "shacl-docs" and .expired == false)] | length')
            if [ "$n" -eq 0 ]; then
              echo "Docs were not rebuilt in run $TRIGGER_RUN, nothing to deploy"
              exit 0
            fi
            echo "run_id=$TRIGGER_RUN" >> "$GITHUB_OUTPUT"
          else
            id=$(gh api "repos/$REPO/actions/artifacts?name=shacl-docs&per_page=100" \
                  --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
            if [ -z "$id" ]; then
              echo "::error::No unexpired shacl-docs artifact on main. Run 'Generate Documentation' manually first."
              exit 1
            fi
            echo "run_id=$id" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: find-docs
    if: needs.find-docs.outputs.run-id != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download generated docs
        uses: actions/download-artifact@v8
        with:
          name: shacl-docs
          path: docs/
          run-id: ${{ needs.find-docs.outputs.run-id }}
          github-token: ${{ github.token }}

      - uses: actions/configure-pages@v6

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build SPARQL query guide
        run: |
          pandoc docs/sparql-psmv-query-guide.md \
            --standalone \
            --toc \
            --metadata title="SPARQL Query Guide: Plant Protection Products" \
            -o docs/query-guide.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - uses: actions/deploy-pages@v5
        id: deployment