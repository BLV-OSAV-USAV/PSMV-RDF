name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_run:
    workflows: ["Generate Documentation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Find docs run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            id=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Generate Documentation" \
              --branch main --status success --limit 1 \
              --json databaseId -q '.[0].databaseId')
            if [ -z "$id" ]; then
              echo "::error::No successful 'Generate Documentation' run on main found. Run it manually first."
              exit 1
            fi
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download generated docs
        uses: actions/download-artifact@v4
        with:
          name: shacl-docs
          path: docs/
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - uses: actions/configure-pages@v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build SPARQL query guide
        run: |
          pandoc docs/sparql-psmv-query-guide.md \
            --standalone \
            --toc \
            --metadata title="SPARQL Query Guide: Plant Protection Products" \
            -o docs/query-guide.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - uses: actions/deploy-pages@v4
        id: deployment
