name: Primary Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data/mapping/**'
      - 'rdf/ontology/**'
      - 'rdf/shapes/**'
      - 'src/**'
      - 'service/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: primary-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  primary-pipeline:
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--')
          && !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy key only where we push; PRs use HTTPS
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.DEPLOY_KEY || '' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
          python-version: "3.12"
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssh2-1-dev

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Show installed packages
        run: uv pip list

      - name: Verify src import
        run: uv run python -c "import src; print(src.__file__)"

      - name: Run pipeline script
        run: uv run python service/pipeline.py

      - name: Tests
        run: uv run pytest -v -rs

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: update pipeline outputs [skip ci]"
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "Push failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "Push failed after 5 attempts"
          exit 1