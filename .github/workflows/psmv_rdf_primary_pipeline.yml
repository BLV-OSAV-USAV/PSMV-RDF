name: Primary Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'src/**'
      - 'service/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/psmv_rdf_primary_pipeline.yml'

permissions:
  contents: write

concurrency:
  group: primary-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-pipeline:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-caching: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssh2-1-dev

      - name: Install dependencies
        run: uv sync --frozen

      - name: Show installed packages
        run: uv pip list

      - name: Verify src import
        run: uv run python -c "import src; print(src.__file__)"

      - name: Run pipeline script
        run: uv run python service/pipeline.py

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update pipeline outputs [skip ci]"
          git push origin main
